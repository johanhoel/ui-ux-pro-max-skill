  <text x="65" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>

  <text x="95" y="130" font-size="16" font-weight="700" fill="#f8fafc">Fix Empty Status Column in styles.csv</text>
  <text x="95" y="152" font-size="12" fill="#94a3b8">Impact: HIGH | Effort: LOW (1-2 hours)</text>

  <rect x="95" y="165" width="800" height="28" rx="6" fill="#0f172a"/>
  <text x="110" y="183" font-size="11" fill="#e2e8f0">Step 1: Cross-reference catalog-summary.json and data-provenance.json to determine active/deprecated status</text>

  <rect x="95" y="197" width="800" height="28" rx="6" fill="#0f172a"/>
  <text x="110" y="215" font-size="11" fill="#e2e8f0">Step 2: Populate Status column (active/deprecated/supplemental) for all 88 style entries</text>

  <rect x="95" y="229" width="800" height="28" rx="6" fill="#0f172a"/>
  <text x="110" y="247" font-size="11" fill="#e2e8f0">Step 3: Update validate_data.py to check for empty Status values</text>

