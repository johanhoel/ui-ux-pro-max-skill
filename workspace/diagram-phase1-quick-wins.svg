  <text x="95" y="310" font-size="16" font-weight="700" fill="#f8fafc">Add Missing Stack Coverage (SvelteKit, SolidJS, Qwik)</text>
  <text x="95" y="332" font-size="12" fill="#94a3b8">Impact: MEDIUM | Effort: LOW (2-3 hours)</text>

  <rect x="95" y="345" width="800" height="28" rx="6" fill="#0f172a"/>
  <text x="110" y="363" font-size="11" fill="#e2e8f0">Step 1: Create stacks/sveltekit.csv following the pattern from stacks/svelte.csv</text>

